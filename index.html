<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weasel Messenger</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- AUTH SCREENS -->
  <div class="container">

    <h1>Weasel Messenger</h1>

    <!-- LOGIN -->
    <div id="login-box" class="box">
      <h2>Login</h2>
      <input id="login-email" type="email" placeholder="Email">
      <input id="login-password" type="password" placeholder="Password">
      <button id="login-btn">Login</button>
      <p class="switch">No account? <span id="show-signup">Sign up</span></p>
    </div>

    <!-- SIGNUP -->
    <div id="signup-box" class="box hidden">
      <h2>Sign Up</h2>
      <input id="signup-email" type="email" placeholder="Email">
      <input id="signup-password" type="password" placeholder="Password">
      <input id="signup-username" type="text" placeholder="Username">
      <button id="signup-btn">Create Account</button>
      <p class="switch">Already have an account? <span id="show-login">Login</span></p>
    </div>

  </div>

  <!-- APP SCREEN -->
  <div id="app-screen" class="hidden app-layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <h2>Menu</h2>

      <button class="side-btn" id="profile-btn">Profile</button>
      <button class="side-btn" id="add-friend-btn">Add Friend</button>
      <button class="side-btn" id="messages-btn">Messages</button>
      <button class="side-btn" id="settings-btn">Settings</button>

      <button class="side-btn logout" id="logout-btn">Logout</button>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
      <h2 id="main-title">Welcome to Weasel Messenger</h2>

      <!-- PROFILE PANEL -->
      <div id="profile-panel" class="panel hidden">
        <h3>Your Profile</h3>
        <p id="profile-username"></p>
        <p id="profile-email"></p>
      </div>

      <!-- ADD FRIEND PANEL -->
      <div id="add-friend-panel" class="panel hidden">
        <h3>Add Friend</h3>
        <input id="friend-username" type="text" placeholder="Friend username">
        <button id="send-friend-request">Send Request</button>
      </div>

      <!-- SETTINGS PANEL -->
      <div id="settings-panel" class="panel hidden">
        <h3>Settings</h3>

        <label>Appearance:</label>

        <div class="theme-options">
          <label class="radio-option">
            <input type="radio" name="theme-mode" value="light" checked>
            Light Mode
          </label>

          <label class="radio-option">
            <input type="radio" name="theme-mode" value="dark">
            Dark Mode
          </label>
        </div>

        <label style="margin-top: 20px;">Text Size:</label>
        <input id="text-size-slider" type="range" min="14" max="26" value="16">
      </div>

      <!-- MESSAGES PANEL (Conversation List) -->
      <div id="messages-panel" class="panel hidden">
        <h3>Messages</h3>

        <button id="new-chat-btn" style="margin-bottom: 15px;">New Chat</button>

        <div id="conversation-list">
          <!-- JS will fill this with DM + room conversations -->
        </div>
      </div>

      <!-- NEW CHAT PANEL -->
      <div id="new-chat-panel" class="panel hidden">
        <h3>Start a New Chat</h3>

        <label>Search by username:</label>
        <input id="new-chat-search" type="text" placeholder="Enter username">

        <button id="new-chat-start">Start Chat</button>

        <h4 style="margin-top: 20px;">Or choose a friend:</h4>
        <div id="new-chat-friends">
          <!-- JS will fill this with friend list -->
        </div>
      </div>

      <!-- DM CHAT PANEL -->
      <div id="dm-panel" class="panel hidden">
        <h3 id="dm-title">Chat</h3>

        <div id="dm-messages" class="messages-area"></div>

        <div class="dm-input-area">
          <input id="dm-input" type="text" placeholder="Type a message...">
          <button id="dm-send">Send</button>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
